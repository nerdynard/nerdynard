---
layout: default
---

<div class="home">
  {{ content }}

  <div class="category-sections">
    {% for category in site.data.categories %}
      <article class="category-feature {% cycle 'category-image-left', 'category-image-right' %}">

        <div class="category-media">
          <a href="{{ category.slug | prepend: '/' | append: '/' | relative_url }}">
            <img src="{{ category.image | relative_url }}"
                alt="{{ category.name | escape }}">
          </a>
        </div>

        <div class="category-content">
          <h2>
            <a href="{{ category.slug | prepend: '/' | append: '/' | relative_url }}">
              {{ category.name | escape }}
            </a>
          </h2>
          <p>{{ category.description }}</p>
        </div>

      </article>
    {% endfor %}
  </div>
</div>
